[package]
name = "autotrixel"
version = "0.1.0"
description = "AutoTrixel - Triangle pixel art editor"
authors = ["kiriketsuki"]
license = ""
repository = ""
default-run = "autotrixel"
edition = "2021"

[lib]
name = "autotrixel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
