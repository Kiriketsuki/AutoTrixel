[package]
name = "trkixel"
version = "0.1.0"
description = "TrKixel - Triangle pixel art editor"
authors = ["kiriketsuki"]
license = ""
repository = ""
default-run = "trkixel"
edition = "2021"

[lib]
name = "trkixel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
