name: Tauri Cross-Platform Build

on:
    push:
        branches:
            - main
            - release
    workflow_dispatch:

jobs:
    build-tauri:
        permissions:
            contents: write
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: ubuntu-latest
                      args: ""
                    - platform: macos-latest
                      args: ""
                    - platform: windows-latest
                      args: ""

        runs-on: ${{ matrix.platform }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Install system dependencies (Ubuntu)
              if: matrix.platform == 'ubuntu-latest'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: "20"
                  cache: "npm"

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@stable

            - name: Cache Cargo registry
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/bin/
                      ~/.cargo/registry/index/
                      ~/.cargo/registry/cache/
                      ~/.cargo/git/db/
                  key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-registry-

            - name: Cache Cargo build target
              uses: actions/cache@v4
              with:
                  path: src-tauri/target
                  key: ${{ runner.os }}-cargo-target-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('src-tauri/src/**') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-target-${{ hashFiles('**/Cargo.lock') }}-
                      ${{ runner.os }}-cargo-target-

            - name: Install JS dependencies
              run: npm ci

            - name: Build Tauri app
              uses: tauri-apps/tauri-action@v0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  tagName: v__VERSION__
                  releaseName: "AutoTrixel v__VERSION__"
                  releaseBody: "See the assets for download links."
                  releaseDraft: true
                  prerelease: false
                  args: ${{ matrix.args }}
